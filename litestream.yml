# SPEC 8.3: continuous WAL replication to R2 (ADR-021).
# Credentials come from LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY.
dbs:
  - path: ${DATABASE_PATH}
    replicas:
      - type: s3
        endpoint: ${R2_ENDPOINT}
        bucket: ${R2_BUCKET}
        path: litestream/wecooked.db
        region: auto
