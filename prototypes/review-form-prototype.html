<!doctype html>
<!-- PROTOTYPE — throwaway. Question: does the SPEC 7.2 review form field order and
     interaction set feel right on an iPhone? Three layout variants, switchable via
     ?variant=A|B|C or the floating bar. Delete or fold verdict into an ADR.
     Design pass 2026-07-29: adopted the cooking-prototype tokens (warm palette,
     saffron accent, dark mode), Lucide inline icons, 44px targets, full-width
     lines, real SPEC 3.4 tag vocabulary, undo on remove, warning jump-links,
     sessionStorage draft. Critique snapshot: .impeccable/critique/ -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review form prototype — We Cooked</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7; --card: #fff; --ink: #1c1917; --muted: #78716c;
    --line: #e7e5e4;
    --accent: #b45309; --on-accent: #fff;
    font-size: 17px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171412; --card: #221f1c; --ink: #f5f5f4; --muted: #a8a29e;
            --line: #3a3532; --accent: #f59e0b; --on-accent: #2a1a00; }
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  main { max-width: 44rem; margin: 0 auto; padding: 1rem 0 11rem; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 1.15em; height: 1.15em; vertical-align: -.2em; flex: none; }
  .vh { position: absolute; width: 1px; height: 1px; overflow: hidden;
        clip-path: inset(50%); white-space: nowrap; }

  header { padding: 0 1rem .25rem; }
  header h1 { font-size: 1.4rem; letter-spacing: -.01em; }
  header .sub { color: var(--muted); font-size: .9rem; margin-top: .15rem; }

  section { background: var(--card); margin: .6rem .75rem; border: 1px solid var(--line);
            border-radius: 1rem; padding: .9rem; }
  label.fld { display: block; font-size: .8rem; font-weight: 600; color: var(--muted);
              text-transform: uppercase; letter-spacing: .05em; margin-bottom: .3rem; }
  h2.sec { font-size: 1.05rem; margin: 0 0 .6rem; }
  .hint { font-size: .85rem; color: var(--muted); margin: .4rem 0 0; }
  input[type=text], input[type=url], input[type=number], textarea {
    width: 100%; font: inherit; padding: .55rem .6rem; border: 1px solid var(--line);
    border-radius: .5rem; background: var(--card); color: var(--ink); min-height: 2.75rem; }
  textarea { resize: vertical; }
  .row { display: flex; gap: .6rem; align-items: center; }
  .row > * { flex: 1; }

  /* banner (D6): one pattern for warnings, undo, stale body, save errors */
  .banner { display: flex; align-items: flex-start; gap: .6rem; margin: .5rem 0 0;
            padding: .7rem .9rem; border: 1px solid var(--line);
            border-left: 4px solid var(--accent); border-radius: .6rem;
            background: var(--card); font-size: .95rem; }
  .banner:first-child { margin-top: 0; }
  .banner .i { color: var(--accent); margin-top: .15rem; }
  .banner .txt { flex: 1; }
  .banner .act { color: var(--accent); font-weight: 600; white-space: nowrap;
                 text-decoration: underline; min-height: 2.75rem; margin: -.55rem 0; }
  .flag { display: inline-flex; align-items: center; gap: .25rem; font-size: .8rem;
          font-weight: 600; color: var(--accent); border: 1px solid var(--accent);
          border-radius: 999px; padding: .1rem .5rem; margin-left: .4rem; }
  .flash { outline: 3px solid var(--accent); outline-offset: 2px; }

  /* image strip */
  .strip { display: flex; gap: .5rem; overflow-x: auto; padding-top: .25rem; }
  .thumb { flex: 0 0 5.5rem; height: 5.5rem; border-radius: .7rem; border: 1px solid var(--line);
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           gap: .15rem; font-size: .7rem; color: var(--muted); text-align: center;
           background: var(--bg); }
  .thumb .i { width: 1.6em; height: 1.6em; }
  .thumb.cover { border: 2px solid var(--accent); }
  .thumb.cover strong { color: var(--accent); }

  /* stepper (incumbent shape) */
  .stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line);
             border-radius: 999px; overflow: hidden; background: var(--card); }
  .stepper button { width: 2.75rem; height: 2.75rem; display: grid; place-items: center; }
  .stepper output { min-width: 2.2rem; text-align: center; font-weight: 600;
                    font-variant-numeric: tabular-nums; }

  /* unit segmented control (incumbent .seg) */
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: .7rem;
         overflow: hidden; }
  .seg button { padding: .45rem 1.1rem; min-height: 2.75rem; font-size: .95rem;
                display: flex; flex-direction: column; align-items: center; gap: .05rem; }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent);
                                   font-weight: 600; }
  .seg small { font-size: .65rem; opacity: .85; }

  /* editor lines: full-width text, 44px controls on their own row, ✕ far from arrows */
  .linewrap { margin: .5rem 0 .9rem; }
  .linewrap .row { align-items: flex-start; }
  .stepnum { flex: none; width: 1.4rem; text-align: right; font-weight: 700;
             color: var(--accent); padding-top: .55rem; font-variant-numeric: tabular-nums; }
  .ctl { display: flex; gap: .35rem; margin-top: .35rem; }
  .ctl .sp { flex: 1; }
  .ctl button { width: 2.75rem; height: 2.75rem; display: grid; place-items: center;
                border: 1px solid var(--line); border-radius: .5rem; background: var(--card); }
  .ctl button:disabled { opacity: .35; }
  .grouphead { display: flex; gap: .35rem; align-items: center; margin: 1rem 0 .2rem; }
  .grouphead input { flex: 1; font-style: italic; }
  .grouphead button { width: 2.75rem; height: 2.75rem; flex: none; display: grid;
                      place-items: center; border: 1px solid var(--line);
                      border-radius: .5rem; background: var(--card); }
  .addbtn { margin-top: .25rem; padding: .55rem .9rem; min-height: 2.75rem; font-size: .95rem;
            display: inline-flex; align-items: center; gap: .35rem;
            border: 1px dashed var(--muted); border-radius: .5rem; background: var(--card); }

  /* chips (D5, incumbent construction: real check span, fill + checkmark + word) */
  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .35rem 0 1rem; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; min-height: 2.75rem;
          border: 1.5px solid var(--line); border-radius: 999px; padding: .3rem .8rem;
          font-size: .95rem; background: var(--card); }
  .chip[aria-pressed=true], .chip[aria-checked=true] {
          background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .chip .check { display: none; }
  .chip[aria-pressed=true] .check, .chip[aria-checked=true] .check { display: inline-flex; }
  .more { color: var(--accent); font-weight: 600; text-decoration: underline;
          min-height: 2.75rem; padding: 0 .4rem; }
  .grouplabel { font-size: .8rem; font-weight: 600; color: var(--muted);
                text-transform: uppercase; letter-spacing: .05em; }
  .grouplabel .card2 { font-weight: 400; text-transform: none; letter-spacing: 0; }

  .savebar { position: fixed; bottom: 0; left: 0; right: 0; margin: 0 auto; max-width: 44rem;
             padding: .6rem .75rem calc(.6rem + env(safe-area-inset-bottom));
             background: var(--card); border-top: 1px solid var(--line); z-index: 5; }
  .savebar button { width: 100%; padding: .8rem; min-height: 3rem; font-size: 1rem;
                    font-weight: 600; border-radius: .7rem;
                    background: var(--accent); color: var(--on-accent); }

  /* ===== variant B: section filter bar ===== */
  .tabbar { position: sticky; top: 0; z-index: 4; display: none; gap: .35rem;
            padding: .5rem .75rem; background: var(--bg); border-bottom: 1px solid var(--line); }
  body[data-variant=B] .tabbar { display: flex; }
  .tabbar button { flex: 1; min-height: 2.75rem; font-size: .9rem;
                   border: 1.5px solid var(--line); border-radius: .5rem; background: var(--card); }
  .tabbar button[aria-pressed=true] { background: var(--accent); color: var(--on-accent);
                                      border-color: var(--accent); font-weight: 600; }

  /* ===== variant C: accordion sheet ===== */
  body[data-variant=C] main { background: var(--card); }
  body[data-variant=C] details.acc { border-bottom: 1px solid var(--line); }
  body[data-variant=C] details.acc > summary { list-style: none; display: flex; gap: .6rem;
      align-items: baseline; padding: .85rem 1rem; cursor: pointer;
      -webkit-tap-highlight-color: transparent; min-height: 2.75rem; }
  body[data-variant=C] details.acc > summary::-webkit-details-marker { display: none; }
  body[data-variant=C] details.acc > summary .chev { color: var(--muted);
      transition: transform .15s; align-self: center; }
  body[data-variant=C] details.acc[open] > summary .chev { transform: rotate(180deg); }
  body[data-variant=C] details.acc > summary .name { font-weight: 600; font-size: .95rem;
      flex: none; }
  body[data-variant=C] details.acc > summary .sum { color: var(--muted); font-size: .85rem;
      flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      text-align: right; }
  body[data-variant=C] details.acc section { margin: 0; border: 0; border-radius: 0;
      padding: 0 1rem 1rem; }
  /* keep the labels in the a11y tree — hide visually only */
  body[data-variant=C] details.acc section h2.sec,
  body[data-variant=C] details.acc section > label.fld:first-child {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip-path: inset(50%); white-space: nowrap; }
  body[data-variant=C] .warn-sec { margin: .6rem .75rem; }

  /* floating variant switcher — prototype chrome, deliberately not part of the design */
  .switcher { position: fixed; left: 50%; transform: translateX(-50%);
              bottom: calc(4.6rem + env(safe-area-inset-bottom)); z-index: 10;
              display: flex; gap: 2px; align-items: center; background: #000; color: #fff;
              border-radius: 99px; padding: 4px 6px;
              box-shadow: 0 4px 14px rgb(0 0 0 / .35); font-size: .85rem; }
  .switcher button { width: 2.2rem; height: 2.2rem; color: #fff; }
  .switcher .lbl { min-width: 9rem; text-align: center; }
</style>
</head>
<body>
<main>
<header>
  <h1>Review extraction</h1>
  <div class="sub">From photo · <span id="status">Draft</span></div>
</header>

<!-- 1. warnings — pinned outside tabs/accordion in every variant -->
<section class="warn-sec" aria-label="Extraction warnings" role="status">
  <h2 class="sec">Extraction warnings</h2>
  <div id="warnings"></div>
</section>

<nav class="tabbar" id="tabbar" aria-label="form sections"></nav>

<div id="form">
<!-- 2. title -->
<section id="s-title">
  <label class="fld" for="title">Title · required</label>
  <input type="text" id="title" autocomplete="off">
</section>

<!-- 3. cover picker + image strip -->
<section id="s-images">
  <h2 class="sec">Images</h2>
  <div class="strip" id="strip"></div>
  <p class="hint">Tap a photo to make it the cover.</p>
</section>

<!-- 4. yield / 5. times -->
<section id="s-yield">
  <label class="fld" id="yieldlbl">Yield · required <span id="yieldflag"></span></label>
  <div class="row">
    <div class="stepper" style="flex:0 0 auto" role="group" aria-labelledby="yieldlbl">
      <button type="button" id="ydown" aria-label="decrease yield"></button>
      <output id="ycount" aria-live="polite"></output>
      <button type="button" id="yup" aria-label="increase yield"></button>
    </div>
    <input type="text" id="yunit" aria-label="yield unit" placeholder="servings, muffins, jars…" style="flex:1">
  </div>
  <div class="row" style="margin-top:.8rem">
    <div><label class="fld" for="prep">Prep (minutes)</label><input type="number" id="prep" inputmode="numeric" min="0"></div>
    <div><label class="fld" for="cook">Cook (minutes)</label><input type="number" id="cook" inputmode="numeric" min="0"></div>
  </div>
</section>

<!-- 6. unit-system indicator + toggle -->
<section id="s-units">
  <h2 class="sec">Units</h2>
  <div class="seg" role="group" aria-label="unit system">
    <button type="button" id="usbtn"></button>
    <button type="button" id="metricbtn"></button>
  </div>
  <p class="hint" id="bodyhint"></p>
</section>

<!-- 7. ingredient groups -->
<section id="s-ing">
  <h2 class="sec">Ingredients</h2>
  <div id="stale"></div>
  <div id="ingundo"></div>
  <div id="groups"></div>
  <button type="button" class="addbtn" id="addgroup"></button>
  <p class="hint">At least one line is required. Press return in a line to add the next.</p>
</section>

<!-- 8. steps -->
<section id="s-steps">
  <h2 class="sec">Steps</h2>
  <div id="stepundo"></div>
  <div id="steps"></div>
  <button type="button" class="addbtn" id="addstep"></button>
</section>

<!-- 9. tags -->
<section id="s-tags">
  <h2 class="sec">Tags</h2>
  <div id="tags"></div>
</section>

<!-- 10. source -->
<section id="s-source">
  <label class="fld" for="srctext">Source</label>
  <input type="text" id="srctext" placeholder="e.g. book title, page">
  <div style="margin-top:.7rem">
    <label class="fld" for="srcurl">Source URL</label>
    <input type="url" id="srcurl">
  </div>
</section>

<!-- 11. notes -->
<section id="s-notes">
  <label class="fld" for="notes">Notes</label>
  <textarea id="notes" rows="3"></textarea>
</section>
</div>

<div id="savebanner" style="margin:.6rem .75rem"></div>
</main>

<div class="savebar"><button type="button" id="save">Save recipe</button></div>

<div class="switcher" id="switcher">
  <button type="button" id="prevvar" aria-label="previous variant">←</button>
  <span class="lbl" id="varlbl"></span>
  <button type="button" id="nextvar" aria-label="next variant">→</button>
</div>

<div id="live" role="status" class="vh"></div>

<script>
/* Lucide glyphs, inlined (D14: no other icon style; the real app uses lucide-svelte). */
const ICONS = {
  "triangle-alert": '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4"/><path d="M12 17h.01"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/>',
  "arrow-up": '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  "arrow-down": '<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  minus: '<path d="M5 12h14"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  "chevron-down": '<path d="m6 9 6 6 6-6"/>',
  "undo-2": '<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 5.5 5.5a5.5 5.5 0 0 1-5.5 5.5H11"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

// ponytail: one mutable state object, full re-render of dynamic lists on structural change.
let state = {
  title: "Lemon Ricotta Pancakes",
  images: [
    { label: "Photo 1 (capture)", cover: true },
    { label: "Photo 2 (capture)", cover: false },
  ],
  yieldCount: 4, yieldUnit: "servings",
  prep: 15, cook: 20,
  sourceBody: "us",   // ADR-028: the body a human last authored
  viewing: "us",
  editedBody: null,   // which body the human touched this session (drives the D6 stale banner)
  yieldFlagged: true, // warning 2: yield was guessed — cleared when the user touches it
  groups: [
    { heading: "Batter", lines: [
      { us: "1 cup ricotta", metric: "250 g ricotta" },
      { us: "3/4 cup flour", metric: "95 g flour" },
      { us: "2 eggs, separated", metric: "2 eggs, separated" },
      { us: "zest of 1 lemon", metric: "zest of 1 lemon" },
    ]},
    { heading: "To serve", lines: [
      { us: "2 tbsp maple syrup", metric: "30 ml maple syrup" },
      { us: "1 handful blueberries", metric: "1 handful blueberries" },
    ]},
  ],
  steps: [
    { text: "Whisk ricotta, egg yolks, and lemon zest together.", flag: false },
    { text: "Fold in the flour until just combined.", flag: false },
    { text: "Beat egg whites to soft peaks and fold into the batter.", flag: false },
    { text: "Cook ladlefuls on a buttered pan over medium heat until", flag: true }, // cut off — warning 1
  ],
  tags: { meal: new Set(["breakfast"]), cuisine: "italian", protein: null, effort: "quick", damage: "tidy" },
  srctext: "Breakfast for Two, p. 41", srcurl: "", notes: "",
};

// full closed vocabulary from SPEC 3.4
const TAGS = [
  { key: "meal",    label: "Meal type", card: "pick any", opts: ["breakfast","lunch","dinner","side","salad","soup","bread","dessert","snack","sauce","drink"] },
  { key: "cuisine", label: "Cuisine",   card: "one or none", opts: ["italian","french","spanish","greek","middle-eastern","north-african","indian","thai","vietnamese","chinese","japanese","korean","mexican","american","british","central-european","nordic","caribbean","west-african"] },
  { key: "protein", label: "Protein",   card: "one or none", opts: ["chicken","beef","pork","lamb","fish","seafood","egg","tofu","beans","cheese","none"] },
  { key: "effort",  label: "Effort",    card: "required, pick one", opts: ["quick","weeknight","project"] },
  { key: "damage",  label: "Damage",    card: "required, pick one", opts: ["tidy","messy","carnage"] },
];
const expanded = {};       // per-group "show all" toggle, not part of the draft
let lastRemoved = null;    // { where:'ing'|'step', label, restore() }
let pendingFocus = null;   // {gi, li} — focus a new ingredient line after render

const $ = id => document.getElementById(id);
const announce = m => { $("live").textContent = m; };

/* draft persistence: a phone call or the variant switcher must not cost the review */
const DRAFT_KEY = "wecooked-review-proto";
function persist(){
  const d = { ...state, tags: { ...state.tags, meal: [...state.tags.meal] } };
  sessionStorage.setItem(DRAFT_KEY, JSON.stringify(d));
  $("status").textContent = "Draft saved";
}
try {
  const d = JSON.parse(sessionStorage.getItem(DRAFT_KEY));
  if (d) { d.tags.meal = new Set(d.tags.meal); state = d; }
} catch {}

/* warnings: each is a D6 banner whose action jumps to and marks the field it names */
const WARNINGS = [
  { text: "Step 4 was cut off at the page edge; the last sentence may be incomplete.",
    go(){ const i = state.steps.findIndex(s => s.flag);
          jump("s-steps", i >= 0 ? $("steps").querySelectorAll("textarea")[i] : null); } },
  { text: "The yield was not visible in the photo; 4 is a guess from the ingredient amounts.",
    go(){ jump("s-yield", $("ycount").parentElement); } },
];
function jump(sectionId, el){
  const det = $(sectionId)?.closest("details");
  if (det) det.open = true;
  if (document.body.dataset.variant === "B") {
    const entry = B_TABS.find(([, ids]) => ids.includes(sectionId));
    if (entry) $("tabbar").querySelector(`[data-tab="${entry[0]}"]`)?.click();
  }
  const target = el || $(sectionId);
  target.scrollIntoView({ behavior: "smooth", block: "center" });
  target.classList.add("flash");
  setTimeout(() => target.classList.remove("flash"), 2000);
  if (el && el.focus) el.focus({ preventScroll: true });
}
$("warnings").innerHTML = "";
WARNINGS.forEach((w, i) => {
  const b = document.createElement("div"); b.className = "banner";
  b.innerHTML = `${icon("triangle-alert")}<span class="txt">${w.text}</span>`;
  const act = document.createElement("button");
  act.type = "button"; act.className = "act"; act.textContent = "Show me";
  act.setAttribute("aria-label", `show warning ${i+1} in the form`);
  act.onclick = w.go;
  b.append(act); $("warnings").append(b);
});

// static bindings
for (const [id, key] of [["title","title"],["yunit","yieldUnit"],["prep","prep"],
    ["cook","cook"],["srctext","srctext"],["srcurl","srcurl"],["notes","notes"]]) {
  $(id).value = state[key];
  $(id).oninput = e => { state[key] = e.target.value; refreshSummaries(); persist(); };
}
$("ydown").innerHTML = icon("minus");
$("yup").innerHTML = icon("plus");
$("ydown").onclick = () => { state.yieldCount = Math.max(1, state.yieldCount - 1); touchYield(); };
$("yup").onclick   = () => { state.yieldCount++; touchYield(); };
$("yunit").addEventListener("input", () => { state.yieldFlagged = false; renderYield(); });
function touchYield(){ state.yieldFlagged = false; renderYield(); refreshSummaries(); persist(); }
function renderYield(){
  $("ycount").textContent = state.yieldCount;
  $("yieldflag").innerHTML = state.yieldFlagged
    ? `<span class="flag">${icon("triangle-alert")} guessed, check it</span>` : "";
}

$("usbtn").onclick = () => { state.viewing = "us"; render(); };
$("metricbtn").onclick = () => { state.viewing = "metric"; render(); };

function move(arr, i, d){ const j = i + d; [arr[i], arr[j]] = [arr[j], arr[i]]; }

$("addgroup").innerHTML = icon("plus") + " Add group";
$("addstep").innerHTML = icon("plus") + " Add step";
$("addgroup").onclick = () => { state.groups.push({ heading: "", lines: [{ us: "", metric: "" }] }); render(); };
$("addstep").onclick = () => { state.steps.push({ text: "", flag: false }); render(); };

function ctlBtn(name, aria, fn, dis){
  const b = document.createElement("button");
  b.type = "button"; b.innerHTML = icon(name); b.setAttribute("aria-label", aria);
  b.disabled = !!dis; b.onclick = fn;
  return b;
}
function undoBanner(container, msg){
  container.innerHTML = "";
  if (!lastRemoved) return;
  const b = document.createElement("div"); b.className = "banner";
  b.innerHTML = `${icon("undo-2")}<span class="txt">${msg}</span>`;
  const act = document.createElement("button");
  act.type = "button"; act.className = "act"; act.textContent = "Undo";
  act.onclick = () => { lastRemoved.restore(); lastRemoved = null; announce("Restored."); render(); };
  b.append(act); container.append(b);
}
function removed(where, label, restore){
  lastRemoved = { where, label, restore };
  announce(`Removed ${label}. Undo available.`);
}

function lineRow(g, gi, li){
  const line = g.lines[li];
  const wrap = document.createElement("div"); wrap.className = "linewrap";
  const inp = document.createElement("input");
  inp.type = "text"; inp.value = line[state.viewing];
  inp.setAttribute("aria-label", `ingredient line ${li+1} of ${g.lines.length}${g.heading ? ", " + g.heading : ""}`);
  inp.oninput = e => { line[state.viewing] = e.target.value;
    state.editedBody = state.viewing; refreshSummaries(); persist(); }; // edit marks this body source on save (ADR-028)
  inp.onkeydown = e => {
    if (e.key === "Enter") { e.preventDefault();
      g.lines.splice(li + 1, 0, { us: "", metric: "" });
      pendingFocus = { gi, li: li + 1 }; render(); }
  };
  const ctl = document.createElement("div"); ctl.className = "ctl";
  ctl.append(
    ctlBtn("x", `remove line ${li+1}`, () => {
      const [gone] = g.lines.splice(li, 1);
      removed("ing", `“${gone[state.viewing] || "empty line"}”`,
        () => g.lines.splice(li, 0, gone));
      render();
    }),
    Object.assign(document.createElement("span"), { className: "sp" }),
    ctlBtn("arrow-up", `move line ${li+1} up`, () => { move(g.lines, li, -1);
      announce(`Moved to position ${li}.`); render(); }, li === 0),
    ctlBtn("arrow-down", `move line ${li+1} down`, () => { move(g.lines, li, 1);
      announce(`Moved to position ${li+2}.`); render(); }, li === g.lines.length - 1),
  );
  wrap.append(inp, ctl);
  return wrap;
}

function grow(ta){ ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; }

function render(){
  renderYield();

  // unit toggle: incumbent segmented control; both facts live on the buttons
  const src = state.sourceBody;
  for (const [id, body, name] of [["usbtn","us","US"],["metricbtn","metric","Metric"]]){
    const b = $(id);
    b.setAttribute("aria-pressed", state.viewing === body);
    b.innerHTML = `${name}<small>${src === body ? "as written" : "converted"}</small>`;
  }
  $("bodyhint").textContent = state.viewing === src
    ? "“As written” is the version a human last wrote; the other is machine-converted."
    : "This version is machine-converted. Editing it makes it the “as written” one when you save.";

  // stale-counterpart banner (SPEC 7.2 / ADR-028, same D6 banner as everywhere)
  $("stale").innerHTML = "";
  if (state.editedBody && state.viewing !== state.editedBody) {
    const b = document.createElement("div"); b.className = "banner";
    b.innerHTML = `${icon("triangle-alert")}<span class="txt">Not yet updated from your ${state.editedBody === "us" ? "US" : "metric"} edit. This version reconverts after you save.</span>`;
    $("stale").append(b);
  }

  // undo banner lives in the section where the removal happened
  $("ingundo").innerHTML = ""; $("stepundo").innerHTML = "";
  if (lastRemoved) undoBanner($(lastRemoved.where === "ing" ? "ingundo" : "stepundo"),
    `Removed ${lastRemoved.label}.`);

  // ingredient groups
  const groups = $("groups"); groups.innerHTML = "";
  state.groups.forEach((g, gi) => {
    const head = document.createElement("div"); head.className = "grouphead";
    const hInp = document.createElement("input");
    hInp.type = "text"; hInp.placeholder = "Group heading (optional)"; hInp.value = g.heading;
    hInp.setAttribute("aria-label", `heading of ingredient group ${gi+1}`);
    hInp.oninput = e => { g.heading = e.target.value; refreshSummaries(); persist(); };
    const del = ctlBtn("x", `remove group ${g.heading || gi+1} and its ${g.lines.length} lines`, () => {
      const gone = state.groups.splice(gi, 1)[0];
      removed("ing", `the group “${gone.heading || "untitled"}” (${gone.lines.length} lines)`,
        () => state.groups.splice(gi, 0, gone));
      render();
    });
    head.append(hInp, del); groups.append(head);
    g.lines.forEach((_, li) => groups.append(lineRow(g, gi, li)));
    const add = document.createElement("button");
    add.type = "button"; add.className = "addbtn"; add.innerHTML = icon("plus") + " Add line";
    add.onclick = () => { g.lines.push({ us: "", metric: "" });
      pendingFocus = { gi, li: g.lines.length - 1 }; render(); };
    groups.append(add);
  });

  // steps
  const steps = $("steps"); steps.innerHTML = "";
  state.steps.forEach((s, i) => {
    const wrap = document.createElement("div"); wrap.className = "linewrap";
    const row = document.createElement("div"); row.className = "row";
    const num = document.createElement("span"); num.className = "stepnum"; num.textContent = i + 1;
    num.setAttribute("aria-hidden", "true");
    const ta = document.createElement("textarea");
    ta.value = s.text; ta.rows = 1; ta.setAttribute("aria-label", `step ${i+1} of ${state.steps.length}`);
    ta.oninput = e => { s.text = e.target.value; s.flag = false; grow(ta);
      refreshSummaries(); persist(); renderStepFlag(flagSlot, s); };
    row.append(num, ta);
    const ctl = document.createElement("div"); ctl.className = "ctl";
    const flagSlot = document.createElement("span");
    renderStepFlag(flagSlot, s);
    ctl.append(
      ctlBtn("x", `remove step ${i+1}`, () => {
        const [gone] = state.steps.splice(i, 1);
        removed("step", `step “${gone.text.slice(0, 30) || "empty"}…”`,
          () => state.steps.splice(i, 0, gone));
        render();
      }),
      flagSlot,
      Object.assign(document.createElement("span"), { className: "sp" }),
      ctlBtn("arrow-up", `move step ${i+1} up`, () => { move(state.steps, i, -1);
        announce(`Moved to step ${i}.`); render(); }, i === 0),
      ctlBtn("arrow-down", `move step ${i+1} down`, () => { move(state.steps, i, 1);
        announce(`Moved to step ${i+2}.`); render(); }, i === state.steps.length - 1),
    );
    wrap.append(row, ctl); steps.append(wrap);
  });
  steps.querySelectorAll("textarea").forEach(grow);

  // tags: full vocabulary, long groups collapsed behind "Show all N"
  const tags = $("tags"); tags.innerHTML = "";
  TAGS.forEach(group => {
    const lab = document.createElement("div"); lab.className = "grouplabel";
    lab.id = "lbl-" + group.key;
    lab.innerHTML = `${group.label} <span class="card2">· ${group.card}</span>`;
    const wrap = document.createElement("div"); wrap.className = "chips";
    const required = group.key === "effort" || group.key === "damage";
    wrap.setAttribute("role", required ? "radiogroup" : "group");
    wrap.setAttribute("aria-labelledby", lab.id);

    const isOn = opt => group.key === "meal" ? state.tags.meal.has(opt) : state.tags[group.key] === opt;
    let opts = group.opts;
    const long = opts.length > 8 && !expanded[group.key];
    if (long) opts = [...new Set([...opts.slice(0, 7), ...opts.filter(isOn)])];

    opts.forEach(opt => {
      const on = isOn(opt);
      const chip = document.createElement("button");
      chip.type = "button"; chip.className = "chip";
      chip.innerHTML = `<span class="check">${icon("check")}</span>${opt}`;
      if (required) { chip.setAttribute("role", "radio"); chip.setAttribute("aria-checked", on); }
      else chip.setAttribute("aria-pressed", on);
      chip.onclick = () => {
        if (group.key === "meal") on ? state.tags.meal.delete(opt) : state.tags.meal.add(opt);
        else if (required) state.tags[group.key] = opt; // required: no deselect
        else state.tags[group.key] = on ? null : opt;   // single-or-none
        render();
      };
      wrap.append(chip);
    });
    if (group.opts.length > 8) {
      const more = document.createElement("button");
      more.type = "button"; more.className = "more";
      more.textContent = long ? `Show all ${group.opts.length}` : "Show fewer";
      more.onclick = () => { expanded[group.key] = !expanded[group.key]; render(); };
      wrap.append(more);
    }
    tags.append(lab, wrap);
  });

  // image strip
  const strip = $("strip"); strip.innerHTML = "";
  state.images.forEach(img => {
    const t = document.createElement("button");
    t.type = "button"; t.className = "thumb" + (img.cover ? " cover" : "");
    t.innerHTML = `${icon("camera")}<span>${img.label}</span>${img.cover ? "<strong>COVER</strong>" : ""}`;
    t.setAttribute("aria-label", `${img.label}${img.cover ? ", current cover" : ""}, tap to make cover`);
    t.onclick = () => { state.images.forEach(x => x.cover = false); img.cover = true; render(); };
    strip.append(t);
  });

  if (pendingFocus) {
    const { gi, li } = pendingFocus; pendingFocus = null;
    let n = 0;
    for (let i = 0; i < gi; i++) n += state.groups[i].lines.length;
    $("groups").querySelectorAll(".linewrap input")[n + li]?.focus();
  }
  refreshSummaries();
  persist();
}
function renderStepFlag(slot, s){
  slot.innerHTML = s.flag ? `<span class="flag">${icon("triangle-alert")} cut off, check it</span>` : "";
}

/* save: inline banner per D6, names what is missing, jumps to the first gap */
$("save").onclick = () => {
  const missing = [];
  if (!state.title.trim()) missing.push(["a title", "s-title"]);
  if (!(state.yieldCount >= 1)) missing.push(["a yield count", "s-yield"]);
  if (!state.groups.some(g => g.lines.some(l => (l.us + l.metric).trim()))) missing.push(["at least one ingredient line", "s-ing"]);
  const sb = $("savebanner"); sb.innerHTML = "";
  const b = document.createElement("div"); b.className = "banner";
  if (missing.length) {
    b.innerHTML = `${icon("triangle-alert")}<span class="txt">Can’t save yet: add ${missing.map(m => m[0]).join(" and ")}.</span>`;
    const act = document.createElement("button");
    act.type = "button"; act.className = "act"; act.textContent = "Take me there";
    act.onclick = () => jump(missing[0][1]);
    b.append(act);
    announce(`Can't save yet: add ${missing.map(m => m[0]).join(" and ")}.`);
  } else {
    b.innerHTML = `${icon("check")}<span class="txt">Saved. In the real app this opens the recipe.</span>`;
    b.setAttribute("role", "status");
    $("status").textContent = "Saved";
    announce("Saved.");
  }
  sb.append(b);
  b.scrollIntoView({ behavior: "smooth", block: "nearest" });
};

/* ===== variants =====
   A — Card stack: one scroll of card sections.
   B — Sections bar: sticky filter splits the form into 4 short panes; warnings pinned.
   C — Accordion sheet: flat paper, every section a collapsible row with a live
       one-line summary. Title, Ingredients, and Steps start open so the extraction
       always passes in front of human eyes (ADR-004). */
const VARIANTS = { A: "Card stack", B: "Sections", C: "Accordion sheet" };
const ORDER = ["A", "B", "C"];
const variant = (new URLSearchParams(location.search).get("variant") || "A").toUpperCase();
document.body.dataset.variant = VARIANTS[variant] ? variant : "A";

function gotoVariant(d){
  const i = (ORDER.indexOf(document.body.dataset.variant) + d + 3) % 3;
  location.search = "?variant=" + ORDER[i]; // draft survives via sessionStorage
}
$("prevvar").onclick = () => gotoVariant(-1);
$("nextvar").onclick = () => gotoVariant(1);
$("varlbl").textContent = `${document.body.dataset.variant} — ${VARIANTS[document.body.dataset.variant]}`;
document.addEventListener("keydown", e => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (e.key === "ArrowLeft") gotoVariant(-1);
  if (e.key === "ArrowRight") gotoVariant(1);
});

const B_TABS = [
  ["Basics", ["s-title","s-images","s-yield","s-units"]],
  ["Ingredients", ["s-ing"]],
  ["Steps", ["s-steps"]],
  ["Details", ["s-tags","s-source","s-notes"]],
];
function setupTabs(){
  const bar = $("tabbar");
  const show = name => {
    B_TABS.forEach(([tab, ids]) => {
      ids.forEach(id => $(id).hidden = tab !== name);
      bar.querySelector(`[data-tab="${tab}"]`).setAttribute("aria-pressed", tab === name);
    });
  };
  B_TABS.forEach(([tab]) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = tab; b.dataset.tab = tab;
    b.onclick = () => show(tab);
    bar.append(b);
  });
  show("Basics");
}

const C_SECTIONS = [
  ["s-title",  "Title",        () => state.title || "untitled", true],
  ["s-images", "Images",       () => `${state.images.length} photos`, false],
  ["s-yield",  "Yield & time", () => `${state.yieldCount} ${state.yieldUnit} · ${state.prep || 0}+${state.cook || 0} min`, false],
  ["s-units",  "Units",        () => (state.sourceBody === "us" ? "US" : "Metric") + " as written", false],
  ["s-ing",    "Ingredients",  () => `${state.groups.reduce((n,g) => n + g.lines.length, 0)} lines in ${state.groups.length} groups`, true],
  ["s-steps",  "Steps",        () => `${state.steps.length} steps`, true],
  ["s-tags",   "Tags",         () => [...state.tags.meal, state.tags.cuisine, state.tags.protein, state.tags.effort, state.tags.damage].filter(Boolean).join(" · ") || "none", false],
  ["s-source", "Source",       () => state.srctext || "none", false],
  ["s-notes",  "Notes",        () => state.notes ? state.notes.slice(0, 40) : "none", false],
];
function setupAccordion(){
  C_SECTIONS.forEach(([id, name, , open]) => {
    const sec = $(id);
    const det = document.createElement("details");
    det.className = "acc"; det.open = open;
    det.innerHTML = `<summary><span class="name">${name}</span><span class="sum" id="sum-${id}"></span><span class="chev">${icon("chevron-down")}</span></summary>`;
    sec.replaceWith(det);
    det.append(sec);
  });
}
function refreshSummaries(){
  if (document.body.dataset.variant !== "C") return;
  C_SECTIONS.forEach(([id, , fn]) => {
    const el = $("sum-" + id);
    if (el) el.textContent = fn();
  });
}

if (document.body.dataset.variant === "B") setupTabs();
if (document.body.dataset.variant === "C") setupAccordion();
render();
</script>
</body>
