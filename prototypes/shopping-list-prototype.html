<!doctype html>
<!-- PROTOTYPE, throwaway. Question: does the SPEC 7.6 / ADR-015 shopping list feel right on a phone?
     Tokens copied from cooking-screen.prototype.html (D4); accent = saffron,
     confirmed by the cooking-screen verdict (docs/UI.md D4). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shopping list — prototype</title>
<style>
  :root {
    --bg: #faf9f7; --card: #fff; --ink: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --strike: #a8a29e;
    --accent: #b45309; --on-accent: #fff;
    --disabled-bg: #e7e5e4; --disabled-ink: #57534e;
    font-size: 17px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #171412; --card: #221f1c; --ink: #f5f5f4; --muted: #a8a29e;
            --line: #3a3532; --strike: #6b6560;
            --accent: #f59e0b; --on-accent: #2a1a00;
            --disabled-bg: #3a3532; --disabled-ink: #a8a29e; }
  }
  * { box-sizing: border-box; margin: 0; }
  html { background: var(--bg); }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 1rem; line-height: 1.45; color: var(--ink); background: var(--bg); }
  /* type scale: 0.8rem / 1rem / 1.35rem only */
  #app { max-width: 393px; min-height: 100dvh; margin: 0 auto; display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  svg.i { width: 1.2em; height: 1.2em; vertical-align: -0.24em; flex: none; }

  header { padding: 14px 16px 10px; }
  h1 { font-size: 1.35rem; letter-spacing: -0.01em; }
  header .sub { font-size: 0.8rem; color: var(--muted); }
  main { flex: 1; padding: 4px 16px 24px; }

  /* ---- banner (D6: one Banner pattern, icon + text) ---- */
  .banner { display: flex; gap: 0.6rem; align-items: center; margin: 0 0 12px;
    padding: 0.7rem 0.9rem; border: 1px solid var(--line); border-radius: 0.6rem;
    background: var(--card); font-size: 0.8rem; }
  .spin { display: inline-block; width: 1em; height: 1em; flex: none; border: 2px solid var(--accent);
    border-right-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- buttons: one component, two roles ---- */
  .btn { display: flex; gap: 0.5rem; align-items: center; justify-content: center; width: 100%;
    min-height: 48px; padding: 0.7rem 1rem; border-radius: 0.8rem; font-weight: 600; }
  .btn.primary { background: var(--accent); color: var(--on-accent); }
  .btn.primary:disabled { background: var(--disabled-bg); color: var(--disabled-ink); }
  .btn.secondary { background: var(--card); border: 1.5px solid var(--line); }

  /* ---- empty state (D13) ---- */
  .empty { text-align: center; color: var(--muted); padding: 15vh 20px 0; }
  .empty .btn { max-width: 240px; margin: 16px auto 0; }

  /* ---- pick screen ---- */
  .recipe { display: flex; align-items: center; gap: 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: 0.8rem; padding: 10px 12px; margin-bottom: 10px;
    min-height: 56px; }
  .recipe input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--accent); flex: none; }
  .recipe .name { flex: 1; min-width: 0; }
  .recipe .name small { display: block; font-size: 0.8rem; color: var(--muted); }
  .stepper { display: inline-flex; align-items: center; border: 1.5px solid var(--line);
    border-radius: 0.7rem; overflow: hidden; background: var(--card); }
  .stepper button { width: 44px; height: 44px; display: grid; place-items: center; }
  .stepper output { min-width: 2.4rem; text-align: center; font-weight: 600;
    font-variant-numeric: tabular-nums; }
  .stepper output small { display: block; font-size: 0.8rem; font-weight: 400; color: var(--muted); line-height: 1.1; }
  .pick-actions { margin-top: 14px; display: grid; gap: 8px; }

  /* ---- skeleton while building ---- */
  .skel { height: 56px; border-radius: 0.8rem; background: var(--card);
    border: 1px solid var(--line); margin-bottom: 8px; opacity: 0.6; }

  /* ---- list screen ---- */
  section h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  ul.items { list-style: none; padding: 0; }
  ul.items li { margin-bottom: 6px; }
  ul.items label { display: flex; gap: 12px; align-items: center; background: var(--card);
    border: 1px solid var(--line); border-radius: 0.8rem; padding: 8px 12px; min-height: 52px;
    cursor: pointer; }
  ul.items input[type=checkbox] { width: 26px; height: 26px; accent-color: var(--accent); flex: none; }
  .txt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .qty { font-weight: 600; font-variant-numeric: tabular-nums; }
  .meta { display: block; font-size: 0.8rem; color: var(--muted); }
  li.ticked .txt { text-decoration: line-through; color: var(--strike); } /* strike + checkbox, never colour alone */

  details.staples { margin-top: 18px; border-top: 1px solid var(--line); }
  details.staples summary { display: flex; gap: 0.4rem; align-items: center; padding: 12px 0;
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;
    color: var(--muted); cursor: pointer; list-style: none; }
  details.staples summary::-webkit-details-marker { display: none; }
  details.staples summary .chev { margin-left: auto; transition: transform 0.15s; }
  details.staples[open] summary .chev { transform: rotate(180deg); }

  .addrow { display: flex; gap: 8px; margin-top: 18px; }
  .addrow input { flex: 1; min-width: 0; font: inherit; padding: 10px 12px; min-height: 48px;
    border: 1.5px solid var(--line); border-radius: 0.7rem; background: var(--card); color: var(--ink); }
  .addrow button { border: 1.5px solid var(--line); background: var(--card); border-radius: 0.7rem;
    padding: 0 16px; min-height: 48px; font-weight: 600; }

  /* unit toggle: quiet, bottom of screen (D15: set once per device). Selected = filled + check (D5). */
  .unitsrow { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 18px; font-size: 0.8rem; color: var(--muted); }
  .seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 0.7rem; overflow: hidden; }
  .seg button { display: flex; gap: 0.3rem; align-items: center; padding: 0.55rem 0.9rem; min-height: 44px;
    font-size: 0.8rem; background: var(--card); color: var(--muted); }
  .seg button .check { display: none; }
  .seg button[aria-pressed=true] { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .seg button[aria-pressed=true] .check { display: inline; }

  .donezone { margin-top: 22px; border-top: 1px solid var(--line); padding-top: 16px; }
  .confirm { background: var(--card); border: 1.5px solid var(--line); border-radius: 0.8rem;
    padding: 12px; }
  .confirm p { margin-bottom: 10px; }
  .confirm .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

  /* ---- tab bar (D1) ---- */
  nav.tabs { position: sticky; bottom: 0; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  nav.tabs a { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 6px; min-height: 50px; font-size: 0.8rem; color: var(--muted);
    text-decoration: none; }
  nav.tabs a[aria-current=page] { color: var(--accent); font-weight: 700; } /* colour + weight, not colour alone */
  nav.tabs svg.i { width: 1.4em; height: 1.4em; }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title">Shopping</h1><div class="sub" id="subtitle" aria-live="polite"></div></header>
  <main id="main"></main>
  <nav class="tabs" aria-label="Main">
    <a href="#" onclick="return false">${{book}}Recipes</a>
    <a href="#" onclick="return false">${{plus}}Add</a>
    <a href="#" aria-current="page" onclick="return false">${{cart}}Shopping</a>
  </nav>
</div>

<script>
// ---- Lucide glyphs (D14; inlined here because a single-file prototype can't tree-shake lucide-svelte) ----
const svg = p => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const I = {
  minus: svg('<path d="M5 12h14"/>'),
  plus: svg('<path d="M5 12h14"/><path d="M12 5v14"/>'),
  check: svg('<path d="M20 6 9 17l-5-5"/>'),
  chevDown: svg('<path d="m6 9 6 6 6-6"/>'),
  trash: svg('<path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/>'),
  book: svg('<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>'),
  cart: svg('<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>'),
  listPlus: svg('<path d="M11 12H3"/><path d="M16 6H3"/><path d="M16 18H3"/><path d="M18 9v6"/><path d="M21 12h-6"/>'),
  pencil: svg('<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/>'),
};
document.querySelector('nav.tabs').innerHTML = document.querySelector('nav.tabs').innerHTML
  .replace('${{book}}', I.book).replace('${{plus}}', I.plus).replace('${{cart}}', I.cart);

// ---- fake data: 3 recipes, quantities per base yield, metric-primary ----
const RECIPES = [
  { id:'tagine', name:'Chicken tagine', base:4, ing:[
    ['chicken thighs', 800,'g','meat and fish'],
    ['onions', 2,'count','produce'],
    ['fresh coriander', 1,'bunch','produce'],
    ['dried apricots', 150,'g','dry goods'],
    ['couscous', 300,'g','dry goods'],
    ['ras el hanout', 2,'tsp','spices'],
    ['chicken stock', 500,'ml','other'],
    ['olive oil', 0,'staple','staple'],
    ['salt', 0,'staple','staple'],
  ]},
  { id:'carbonara', name:'Spaghetti carbonara', base:2, ing:[
    ['guanciale', 100,'g','meat and fish'],
    ['eggs', 3,'count','dairy'],
    ['pecorino', 50,'g','dairy'],
    ['spaghetti', 200,'g','dry goods'],
    ['black pepper', 0,'staple','staple'],
    ['salt', 0,'staple','staple'],
  ]},
  { id:'fishpie', name:'Fish pie', base:4, ing:[
    ['smoked haddock', 400,'g','meat and fish'],
    ['potatoes', 800,'g','produce'],
    ['onions', 1,'count','produce'],
    ['milk', 400,'ml','dairy'],
    ['peas', 200,'g','frozen'],
    ['bay leaves', 2,'count','spices'],
    ['butter', 0,'staple','staple'],
    ['plain flour', 0,'staple','staple'],
  ]},
];
const SECTIONS = ['produce','meat and fish','dairy','dry goods','spices','frozen','other']; // spec order; staples separate

// ---- state (in memory only) ----
const state = {
  screen: 'empty',            // empty | pick | building | list
  selected: { tagine:false, carbonara:false, fishpie:false },
  yields:   { tagine:4, carbonara:2, fishpie:4 },
  imperial: false,            // D15: real app persists per device in localStorage, default metric
  lines: null, staples: null,
  manual: [],                 // survive rebuilds (SPEC 7.6)
  ticks: {},                  // tick key -> true; survives rebuild on exact text match only
  banner: null,               // { text, spinner }
  confirming: false,
};

// ---- fake merge (real thing is one shopping_merge job, ADR-027) ----
function tickKey(section, text) { return section + '|' + text; } // section-scoped so manual "milk" ≠ dairy milk
function buildList() {
  const merged = {}; const staples = {};
  for (const r of RECIPES) {
    if (!state.selected[r.id]) continue;
    const factor = state.yields[r.id] / r.base;
    for (const [name, qty, unit, section] of r.ing) {
      if (section === 'staple') { (staples[name] ??= []).push(r.name); continue; }
      const key = name + '|' + unit + '|' + section;
      merged[key] ??= { name, unit, section, qty:0, from:[] };
      merged[key].qty += qty * factor;
      merged[key].from.push(r.name);
    }
  }
  state.lines = Object.values(merged);
  state.staples = Object.entries(staples).map(([name, from]) => ({ name, from }));
  // ticks survive on exact text match only (deliberately dumb, ADR-015); name the casualties
  const alive = new Set([
    ...state.lines.map(l => tickKey(l.section, lineText(l))),
    ...state.staples.map(s => tickKey('staple', s.name)),
    ...state.manual.map(t => tickKey('manual', t)),
  ]);
  const reset = Object.keys(state.ticks).filter(k => !alive.has(k));
  const kept = Object.keys(state.ticks).length - reset.length;
  for (const k of reset) delete state.ticks[k];
  return { kept, reset: reset.map(k => k.split('|')[1].replace(/^[\d.]+ ?\w* /, '')) };
}

// ---- units ----
function fmtQty(qty, unit, imperial) {
  const round = n => Math.round(n * 10) / 10;
  if (unit === 'g')  return imperial ? ozLb(qty) : round(qty) + ' g';
  if (unit === 'ml') return imperial ? round(qty / 29.57) + ' fl oz' : round(qty) + ' ml';
  if (unit === 'count') return String(Math.ceil(qty)); // you cannot buy 4.5 eggs
  return round(qty) + ' ' + unit; // tsp, bunch: same both systems
}
function ozLb(g) {
  const oz = g / 28.35;
  if (oz < 16) return (Math.round(oz * 2) / 2) + ' oz';
  const lb = Math.floor(oz / 16), rem = Math.round(oz - lb * 16);
  return rem ? `${lb} lb ${rem} oz` : `${lb} lb`;
}
function lineText(l) { // metric-fixed identity so flipping the unit toggle never orphans a tick
  return `${fmtQty(l.qty, l.unit, false)} ${l.name}`.trim();
}

// ---- rendering ----
const main = document.getElementById('main');
const subtitle = document.getElementById('subtitle');
const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function totals() {
  const total = (state.lines?.length ?? 0) + (state.staples?.length ?? 0) + state.manual.length;
  return { total, ticked: Object.keys(state.ticks).length };
}
function updateSubtitle() {
  if (state.screen !== 'list') { subtitle.textContent = {
    empty: '', pick: 'Pick recipes and portions', building: 'Building…' }[state.screen]; return; }
  const { total, ticked } = totals();
  subtitle.textContent = `${ticked} of ${total} ticked · ticks sync to both phones`;
}

function render() {
  document.getElementById('title').textContent = state.screen === 'pick' ? 'New shopping list' : 'Shopping';
  updateSubtitle();
  ({ empty: renderEmpty, pick: renderPick, building: renderBuilding, list: renderList })[state.screen]();
}

function renderEmpty() {
  main.innerHTML = `<div class="empty"><p>Pick recipes to build a list.</p>
    <button class="btn primary" id="go-pick">${I.listPlus}Add recipes</button></div>`;
  document.getElementById('go-pick').onclick = () => { state.screen = 'pick'; render(); };
}

function renderPick() {
  const n = Object.values(state.selected).filter(Boolean).length;
  main.innerHTML = RECIPES.map(r => `
    <div class="recipe">
      <input type="checkbox" id="sel-${r.id}" ${state.selected[r.id] ? 'checked' : ''}>
      <label class="name" for="sel-${r.id}">${esc(r.name)}<small>written for ${r.base} portions</small></label>
      <div class="stepper">
        <button data-step="${r.id}" data-d="-1" aria-label="Fewer portions of ${esc(r.name)}">${I.minus}</button>
        <output>${state.yields[r.id]}<small>portions</small></output>
        <button data-step="${r.id}" data-d="1" aria-label="More portions of ${esc(r.name)}">${I.plus}</button>
      </div>
    </div>`).join('') +
    `<div class="pick-actions">
      <button class="btn primary" id="build" ${n ? '' : 'disabled'}>${n ? `Build list from ${n} recipe${n > 1 ? 's' : ''}` : 'Pick at least one recipe'}</button>
      ${state.lines ? `<button class="btn secondary" id="cancel-pick">Cancel, keep current list</button>` : ''}
    </div>
    <p class="banner" style="margin-top:14px">${I.cart}<span>Builds from saved variations, generating any missing ones first. One job; it survives a locked phone.</span></p>`;

  main.querySelectorAll('[data-step]').forEach(b => b.onclick = () => {
    const id = b.dataset.step;
    state.yields[id] = Math.min(12, Math.max(1, state.yields[id] + +b.dataset.d));
    render();
  });
  main.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = () => {
    state.selected[c.id.slice(4)] = c.checked; render();
  });
  document.getElementById('build')?.addEventListener('click', () => {
    state.screen = 'building'; render();
    // ponytail: fixed 1.4s fake job; the real build is a polled shopping_merge job with a failure/retry Banner (D6)
    setTimeout(() => {
      const { kept, reset } = buildList();
      state.banner = reset.length
        ? { text: `${kept} tick${kept === 1 ? '' : 's'} kept. ${reset.length} reset because the line changed: ${reset.join(', ')}.` }
        : null;
      state.screen = 'list'; render();
    }, 1400);
  });
  document.getElementById('cancel-pick')?.addEventListener('click', () => { state.screen = 'list'; render(); });
}

function renderBuilding() {
  main.innerHTML = `<div class="banner" role="status"><span class="spin"></span>
    <span>Building your list. You can lock your phone; the build carries on.</span></div>` +
    '<div class="skel"></div>'.repeat(5);
}

function itemHTML(section, text, meta, dualHTML) {
  const key = tickKey(section, text);
  const ticked = !!state.ticks[key];
  return `<li class="${ticked ? 'ticked' : ''}">
    <label><input type="checkbox" data-tick="${esc(key)}" ${ticked ? 'checked' : ''}>
    <span class="txt">${dualHTML ?? esc(text)}<span class="meta">${esc(meta)}</span></span></label>
  </li>`;
}

function renderList() {
  let html = state.banner ? `<div class="banner" role="status">${I.check}<span>${esc(state.banner.text)}</span></div>` : '';
  state.banner = null;

  for (const sec of SECTIONS) {
    const lines = state.lines.filter(l => l.section === sec);
    const manual = sec === 'other' ? state.manual : []; // ponytail: manual lines land in "other"; real app could ask a section
    if (!lines.length && !manual.length) continue;
    html += `<section><h2>${sec}</h2><ul class="items">`;
    html += lines.map(l => {
      const primary = fmtQty(l.qty, l.unit, state.imperial);
      const alt = fmtQty(l.qty, l.unit, !state.imperial);
      const dual = `<span class="qty">${primary}</span> ${esc(l.name)}`;
      const meta = (alt !== primary ? `about ${alt} · ` : '') + l.from.join(', ');
      return itemHTML(sec, lineText(l), meta, dual);
    }).join('');
    html += manual.map(t => itemHTML('manual', t, 'added by hand')).join('');
    html += `</ul></section>`;
  }

  html += `<details class="staples"><summary>Check you have (${state.staples.length}) <span class="chev">${I.chevDown}</span></summary><ul class="items">` +
    state.staples.map(s => itemHTML('staple', s.name, 'from ' + s.from.join(', '))).join('') + `</ul></details>`;

  html += `<form class="addrow" id="addform">
      <input id="addinput" placeholder="Add item (bin bags, milk…)" aria-label="Add item by hand">
      <button type="submit">${I.plus}Add</button>
    </form>
    <div class="unitsrow"><span id="unitslabel">Show amounts in</span>
      <div class="seg" role="group" aria-labelledby="unitslabel">
        <button id="u-metric" aria-pressed="${!state.imperial}"><span class="check">${I.check}</span>Metric</button>
        <button id="u-imp" aria-pressed="${state.imperial}"><span class="check">${I.check}</span>Imperial</button>
      </div>
    </div>
    <div class="donezone" id="donezone"></div>
    <button class="btn secondary" id="edit" style="margin-top:8px">${I.pencil}Add or remove recipes</button>`;

  main.innerHTML = html;
  renderDonezone();

  // ticking mutates one row; never re-renders the list (keeps focus + SR position)
  main.querySelectorAll('[data-tick]').forEach(c => c.onchange = () => {
    c.checked ? state.ticks[c.dataset.tick] = true : delete state.ticks[c.dataset.tick];
    c.closest('li').classList.toggle('ticked', c.checked);
    updateSubtitle();
  });
  document.getElementById('u-metric').onclick = () => { state.imperial = false; render(); };
  document.getElementById('u-imp').onclick = () => { state.imperial = true; render(); };
  document.getElementById('edit').onclick = () => { state.screen = 'pick'; render(); };
  document.getElementById('addform').onsubmit = e => {
    e.preventDefault();
    const v = document.getElementById('addinput').value.trim();
    if (v) { state.manual.push(v); render(); document.getElementById('addinput').focus(); }
  };
}

function renderDonezone() {
  const zone = document.getElementById('donezone');
  if (!state.confirming) {
    zone.innerHTML = `<button class="btn secondary" id="done">${I.trash}Done shopping</button>`;
    document.getElementById('done').onclick = () => { state.confirming = true; renderDonezone(); };
  } else {
    const { total } = totals();
    zone.innerHTML = `<div class="confirm" role="alertdialog" aria-label="Confirm clear list">
      <p>Clear ${total} items and all ticks on <strong>both phones</strong>? The list cannot be brought back.</p>
      <div class="row2">
        <button class="btn secondary" id="cancel-done">Cancel</button>
        <button class="btn primary" id="confirm-done">${I.trash}Clear list</button>
      </div></div>`;
    document.getElementById('cancel-done').onclick = () => { state.confirming = false; renderDonezone(); };
    document.getElementById('confirm-done').onclick = () => {
      Object.assign(state, { lines:null, staples:null, manual:[], ticks:{}, confirming:false,
        selected:{ tagine:false, carbonara:false, fishpie:false }, screen:'empty' });
      render();
    };
  }
}

render();
</script>
</body>
</html>
