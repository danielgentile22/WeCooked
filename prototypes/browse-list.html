<!-- PROTOTYPE, throwaway. Question: SPEC 7.3 browse list; filter groups collapsed into one
     horizontal category bar. Tapping a category opens its options — three variants to compare:
       A  bottom sheet (iOS-style, slides up)
       B  anchored popover under the tapped category
       C  inline accordion row that expands beneath the bar
     Switch with the floating bar at the bottom, or ← / → keys, or ?variant=A|B|C.
     Post-critique polish 2026-07-29: tokens + dark mode from cooking-screen prototype
     (saffron accent = its "recommended" variant, still pending Daniel's confirmation),
     Lucide icons, 44px targets, active-filter row + clear all, result count, D1 tab bar +
     Trash link, D7 job rows as ordinary rows, dialog a11y, variant B anchoring fixed.
     Critique snapshot: .impeccable/critique/2026-07-30T00-23-35Z__prototypes-browse-list-html.md
     Answer goes in prototypes/NOTES.md, then delete this file. Run: open prototypes/browse-list.html -->

<style>
  :root {
    color-scheme: light dark;
    --bg: #faf9f7; --card: #fff; --ink: #1c1917; --muted: #78716c;
    --line: #e7e5e4; --chip-line: #8a8378;
    --accent: #b45309; --on-accent: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171412; --card: #221f1c; --ink: #f5f5f4; --muted: #a8a29e;
      --line: #3a3532; --chip-line: #78716c;
      --accent: #f59e0b; --on-accent: #2a1a00;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: var(--bg); color: var(--ink);
    max-width: 430px; margin: 0 auto;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ic { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2;
        stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; vertical-align: -0.12em; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

  /* sticky search + filter block */
  .top {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    padding: calc(10px + env(safe-area-inset-top)) 16px 8px;
    border-bottom: 1px solid var(--line);
  }
  .head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-size: 20px; }
  #count { font-size: 14px; color: var(--muted); }
  .searchwrap { position: relative; margin-bottom: 8px; }
  .searchwrap .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-size: 17px; }
  .search {
    width: 100%; min-height: 44px; padding: 10px 14px 10px 40px; font-size: 16px;
    border: 1px solid var(--chip-line); border-radius: 12px;
    background: var(--card); color: var(--ink); font-family: inherit;
  }
  .search::placeholder { color: var(--muted); }

  .filterwrap { position: relative; }  /* containing block for variant B's popover */
  .catbar {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px; scrollbar-width: none;
    mask-image: linear-gradient(to right, #000 calc(100% - 28px), transparent);
  }
  .catbar::-webkit-scrollbar { display: none; }
  .cat, .chip {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 44px; padding: 10px 16px; font-size: 15px;
    border: 1px solid var(--chip-line); border-radius: 999px;
    background: var(--card); color: var(--ink); font-family: inherit; flex-shrink: 0;
  }
  .cat .ic { font-size: 13px; color: var(--muted); }
  .cat.on { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
  .cat.on .ic { color: var(--on-accent); }
  .cat[aria-expanded="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .chip[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }

  /* active-filter summary row */
  .activerow { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px 2px 2px; }
  .activerow:empty { display: none; }
  .afchip {
    display: inline-flex; align-items: center; gap: 6px;
    min-height: 36px; padding: 6px 12px; font-size: 14px;
    border: 1px solid var(--accent); border-radius: 999px;
    background: var(--card); color: var(--ink); font-family: inherit;
  }
  .afchip .ic { font-size: 12px; }
  .clearall {
    min-height: 36px; padding: 6px 12px; font-size: 14px; border: 0;
    background: none; color: var(--accent); font-family: inherit; text-decoration: underline;
  }

  /* variant A: bottom sheet */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(28,25,23,.4); }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; margin: 0 auto; max-width: 430px;
    background: var(--card); border-radius: 16px 16px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
    animation: up .18s ease-out;
  }
  @keyframes up { from { transform: translateY(40%); opacity: .5; } }
  .sheet h2 { font-size: 15px; font-weight: 600; margin-bottom: 12px; }
  .opts { display: flex; flex-wrap: wrap; gap: 8px; }
  .sheet .apply {
    margin-top: 16px; width: 100%; min-height: 48px; font-size: 16px; font-weight: 600;
    background: var(--accent); color: var(--on-accent); border: 0; border-radius: 12px; font-family: inherit;
  }

  /* variant B: anchored popover */
  .pop {
    position: absolute; z-index: 20; top: calc(100% + 6px); max-width: 100%;
    background: var(--card); border: 1px solid var(--chip-line); border-radius: 12px;
    box-shadow: 0 6px 16px rgba(28,25,23,.18); padding: 12px;
    animation: fade .12s ease-out;
  }
  @keyframes fade { from { opacity: 0; transform: translateY(-4px); } }

  /* variant C: inline accordion */
  .accordion {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    margin-top: 8px; padding: 12px; animation: fade .12s ease-out;
  }

  main { padding: 8px 16px calc(96px + env(safe-area-inset-bottom)); }

  /* rows: recipes and jobs share one anatomy (D7) */
  .row {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 10px; margin-bottom: 8px;
    color: inherit; text-decoration: none;
  }
  .thumb {
    width: 56px; height: 56px; border-radius: 8px; flex-shrink: 0;
    display: grid; place-items: center; font-size: 28px;
  }
  .thumb.jobico { background: none; font-size: 24px; color: var(--accent); }
  .row .info { min-width: 0; }
  .title {
    font-size: 16px; font-weight: 600; margin-bottom: 5px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .status { font-size: 14px; color: var(--muted); }
  .tags { display: flex; gap: 6px; }
  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 13px; padding: 3px 9px; border-radius: 999px;
    border: 1px solid var(--chip-line); background: var(--card); color: var(--ink);
  }
  .tag .ic { font-size: 12px; color: var(--muted); }
  .spin { animation: spin 1.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; color: var(--ink); padding: 40px 0 12px; font-size: 15px; }
  .empty button {
    display: block; margin: 12px auto 0; min-height: 44px; padding: 10px 18px;
    font-size: 15px; font-family: inherit; border: 1px solid var(--accent);
    border-radius: 999px; background: var(--card); color: var(--accent);
  }
  .trashlink {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 12px;
    font-size: 14px; color: var(--muted); text-decoration: none; min-height: 44px;
  }

  /* D1 bottom tab bar */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; margin: 0 auto; max-width: 430px;
    display: flex; background: var(--card); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom);
  }
  .tabbar a {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 8px 0 6px; font-size: 11px; color: var(--muted); text-decoration: none;
  }
  .tabbar a .ic { font-size: 22px; }
  .tabbar a[aria-current="page"] { color: var(--accent); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) {
    .sheet, .pop, .accordion { animation: none; }
    .spin { animation: none; }
  }

  /* prototype switcher — scaffolding, not part of the design under review */
  .switcher {
    position: fixed; bottom: calc(64px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 4px; z-index: 40;
    background: #0f2740; color: #fff; border-radius: 999px; padding: 6px 8px;
    box-shadow: 0 4px 16px rgba(0,0,0,.3); font-size: 13px;
  }
  .switcher button { background: none; border: 0; color: #fff; font-size: 15px; padding: 4px 8px; font-family: inherit; display: flex; }
  .switcher .lbl { min-width: 150px; text-align: center; }
</style>

<script>
const GROUPS = {
  meal_type: ['dinner','lunch','dessert','soup','bread','side'],
  cuisine:   ['italian','indian','thai','mexican','french','middle-eastern','american'],
  protein:   ['chicken','beef','fish','beans','egg','cheese','none'],
  effort:    ['quick','weeknight','project'],
  damage:    ['tidy','messy','carnage'],
};
const LABELS = { meal_type: 'Meal type', cuisine: 'Cuisine', protein: 'Protein', effort: 'Effort', damage: 'Damage' };

const RECIPES = [
  { t:'Weeknight Chicken Tikka',       e:'🍛', bg:'#f3dfc4', ing:'chicken yogurt garam masala tomato', meal_type:['dinner'], cuisine:'indian', protein:'chicken', effort:'weeknight', damage:'messy' },
  { t:'Cacio e Pepe',                  e:'🍝', bg:'#f0e6cf', ing:'spaghetti pecorino black pepper',    meal_type:['dinner'], cuisine:'italian', protein:'cheese', effort:'quick', damage:'tidy' },
  { t:'Sourdough Loaf',                e:'🍞', bg:'#e7d9c4', ing:'flour water salt starter',           meal_type:['bread'], cuisine:null, protein:'none', effort:'project', damage:'carnage' },
  { t:'Thai Green Curry',              e:'🥥', bg:'#dde8d5', ing:'coconut milk green curry paste basil fish sauce', meal_type:['dinner'], cuisine:'thai', protein:'chicken', effort:'weeknight', damage:'messy' },
  { t:'Shakshuka',                     e:'🍳', bg:'#f2d8c8', ing:'egg tomato pepper cumin',            meal_type:['lunch','dinner'], cuisine:'middle-eastern', protein:'egg', effort:'quick', damage:'tidy' },
  { t:'Beef Birria Tacos',             e:'🌮', bg:'#ecd4c2', ing:'beef chuck guajillo tortilla',       meal_type:['dinner'], cuisine:'mexican', protein:'beef', effort:'project', damage:'carnage' },
  { t:'French Onion Soup',             e:'🧅', bg:'#ead9bd', ing:'onion beef stock gruyere baguette',  meal_type:['soup'], cuisine:'french', protein:'cheese', effort:'project', damage:'messy' },
  { t:'Crispy Smashed Potatoes',       e:'🥔', bg:'#efe3cd', ing:'potato olive oil rosemary',          meal_type:['side'], cuisine:null, protein:'none', effort:'weeknight', damage:'tidy' },
  { t:'Dal Tadka',                     e:'🫘', bg:'#f1e0bf', ing:'red lentils turmeric ghee cumin',    meal_type:['dinner'], cuisine:'indian', protein:'beans', effort:'quick', damage:'tidy' },
  { t:'Lemon Olive Oil Cake',          e:'🍋', bg:'#f5ecc8', ing:'flour lemon olive oil sugar egg',    meal_type:['dessert'], cuisine:'italian', protein:'egg', effort:'weeknight', damage:'messy' },
  { t:'Fish Tacos with Slaw',          e:'🐟', bg:'#d9e4e6', ing:'cod cabbage lime crema tortilla',    meal_type:['dinner'], cuisine:'mexican', protein:'fish', effort:'quick', damage:'messy' },
  { t:'Mac and Cheese',                e:'🧀', bg:'#f4e2b8', ing:'macaroni cheddar butter milk',       meal_type:['dinner'], cuisine:'american', protein:'cheese', effort:'weeknight', damage:'messy' },
];

const VARIANTS = { A: 'Bottom sheet', B: 'Anchored popover', C: 'Inline accordion' };
let variant = new URLSearchParams(location.search).get('variant') || 'A';
if (!VARIANTS[variant]) variant = 'A';

const active = {};                 // group -> Set of selected values
for (const g in GROUPS) active[g] = new Set();
let openGroup = null;
let lastTrigger = null;            // focus returns here when a picker closes

const catbar = document.getElementById('catbar');
const filterwrap = document.getElementById('filterwrap');
const pickerEl = document.getElementById('picker');
const activerow = document.getElementById('activerow');
const q = document.getElementById('q');
q.oninput = renderList;

const icon = (name, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" aria-hidden="true"><use href="#i-${name}"/></svg>`;

function renderCatbar() {
  const scroll = catbar.scrollLeft;   // rebuild resets it; variant B's anchor math needs it
  catbar.innerHTML = '';
  for (const g of Object.keys(GROUPS)) {
    const b = document.createElement('button');
    const n = active[g].size;
    b.className = 'cat' + (n ? ' on' : '');
    b.innerHTML = (n ? icon('check') : '') + `<span>${LABELS[g]}${n ? ' · ' + n : ''}</span>` + icon('chevron-down');
    b.dataset.group = g;
    b.setAttribute('aria-haspopup', 'true');
    b.setAttribute('aria-expanded', String(openGroup === g));
    b.onclick = (ev) => { ev.stopPropagation(); lastTrigger = b; toggleOpen(g, b); };
    catbar.appendChild(b);
  }
  catbar.scrollLeft = scroll;
}

function renderActiveRow() {
  const pairs = [];
  for (const [g, sel] of Object.entries(active)) for (const v of sel) pairs.push([g, v]);
  activerow.innerHTML = '';
  if (!pairs.length) return;
  for (const [g, v] of pairs) {
    const b = document.createElement('button');
    b.className = 'afchip';
    b.innerHTML = `<span>${v}</span>` + icon('x');
    b.setAttribute('aria-label', `Remove filter ${v}`);
    b.onclick = () => { active[g].delete(v); refresh(); };
    activerow.appendChild(b);
  }
  const clear = document.createElement('button');
  clear.className = 'clearall'; clear.textContent = 'Clear all';
  clear.onclick = clearFilters;
  activerow.appendChild(clear);
}

function clearFilters() {
  for (const g in active) active[g].clear();
  q.value = '';
  openGroup = null;
  refresh();
}

function toggleOpen(g, btn) {
  openGroup = (openGroup === g) ? null : g;
  renderCatbar();
  renderPicker(btn);
  if (openGroup === null && lastTrigger) {
    catbar.querySelector(`[data-group="${g}"]`)?.focus();
  }
}

function optionChips(g) {
  const wrap = document.createElement('div');
  wrap.className = 'opts';
  for (const v of GROUPS[g]) {
    const c = document.createElement('button');
    c.className = 'chip';
    const paint = () => {
      const on = active[g].has(v);
      c.setAttribute('aria-pressed', String(on));
      c.innerHTML = (on ? icon('check') : '') + `<span>${v}</span>`;
    };
    paint();
    c.onclick = (ev) => {
      ev.stopPropagation();
      active[g].has(v) ? active[g].delete(v) : active[g].add(v);
      paint();
      renderCatbar(); renderActiveRow(); renderList();
    };
    wrap.appendChild(c);
  }
  return wrap;
}

function renderPicker(anchorBtn) {
  pickerEl.innerHTML = '';
  document.querySelectorAll('.scrim, .sheet, .pop').forEach(el => el.remove());
  document.body.style.overflow = '';
  if (!openGroup) return;
  const g = openGroup;

  if (variant === 'A') {
    const scrim = document.createElement('div');
    scrim.className = 'scrim';
    scrim.onclick = () => toggleOpen(g);
    const sheet = document.createElement('div');
    sheet.className = 'sheet';
    sheet.setAttribute('role', 'dialog');
    sheet.setAttribute('aria-modal', 'true');
    sheet.setAttribute('aria-labelledby', 'sheet-title');
    sheet.innerHTML = `<h2 id="sheet-title">${LABELS[g]}</h2>`;
    sheet.appendChild(optionChips(g));
    const apply = document.createElement('button');
    apply.className = 'apply';
    apply.id = 'sheet-apply';
    apply.onclick = () => toggleOpen(g);
    sheet.appendChild(apply);
    document.body.append(scrim, sheet);
    document.body.style.overflow = 'hidden';
    updateApplyLabel();
    // basic focus trap: move focus in, cycle Tab within the sheet
    sheet.querySelector('.chip').focus();
    sheet.addEventListener('keydown', (ev) => {
      if (ev.key !== 'Tab') return;
      const focusables = sheet.querySelectorAll('button');
      const first = focusables[0], last = focusables[focusables.length - 1];
      if (ev.shiftKey && document.activeElement === first) { ev.preventDefault(); last.focus(); }
      else if (!ev.shiftKey && document.activeElement === last) { ev.preventDefault(); first.focus(); }
    });

  } else if (variant === 'B') {
    const pop = document.createElement('div');
    pop.className = 'pop';
    pop.setAttribute('role', 'group');
    pop.setAttribute('aria-label', LABELS[g] + ' filters');
    pop.appendChild(optionChips(g));
    pop.onclick = (ev) => ev.stopPropagation();
    filterwrap.appendChild(pop);   // positioned ancestor, so absolute works against it
    // anchorBtn is detached by the catbar rebuild in toggleOpen; always re-query
    const btn = catbar.querySelector(`[data-group="${g}"]`);
    let left = btn.offsetLeft - catbar.scrollLeft;
    left = Math.max(0, Math.min(left, filterwrap.clientWidth - pop.offsetWidth));
    pop.style.left = left + 'px';
    pop.querySelector('.chip').focus();

  } else { // C
    const acc = document.createElement('div');
    acc.className = 'accordion';
    acc.setAttribute('role', 'group');
    acc.setAttribute('aria-label', LABELS[g] + ' filters');
    acc.appendChild(optionChips(g));
    acc.onclick = (ev) => ev.stopPropagation();
    pickerEl.appendChild(acc);
    acc.querySelector('.chip').focus();
  }
}

function updateApplyLabel() {
  const apply = document.getElementById('sheet-apply');
  if (apply) apply.textContent = `Show ${RECIPES.filter(matches).length} recipes`;
}

document.addEventListener('click', () => {
  if (openGroup && variant !== 'A') { openGroup = null; renderCatbar(); renderPicker(); }
});
document.addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' && openGroup) {
    const g = openGroup;
    openGroup = null; renderCatbar(); renderPicker();
    catbar.querySelector(`[data-group="${g}"]`)?.focus();
  }
});

function matches(r) {
  const needle = q.value.trim().toLowerCase();
  if (needle) {
    const hay = [r.t, r.ing, r.meal_type.join(' '), r.cuisine, r.protein, r.effort, r.damage].join(' ').toLowerCase();
    if (!hay.includes(needle)) return false;
  }
  for (const [g, sel] of Object.entries(active)) {   // AND across groups, OR within
    if (!sel.size) continue;
    const val = r[g];
    const hit = Array.isArray(val) ? val.some(v => sel.has(v)) : sel.has(val);
    if (!hit) return false;
  }
  return true;
}

function renderList() {
  const hits = RECIPES.filter(matches);
  document.getElementById('count').textContent = `${hits.length} recipe${hits.length === 1 ? '' : 's'}`;
  updateApplyLabel();
  const list = document.getElementById('list');
  if (!hits.length) {
    list.innerHTML = '<div class="empty">No recipes match.</div>';
    const b = document.createElement('button');
    b.textContent = 'Clear search and filters';
    b.onclick = clearFilters;
    list.querySelector('.empty').appendChild(b);
    return;
  }
  list.innerHTML = hits.map(r => `
    <a class="row" href="#" onclick="return false">
      <div class="thumb" style="background:${r.bg}" aria-hidden="true">${r.e}</div>
      <div class="info">
        <div class="title">${r.t}</div>
        <div class="tags">
          <span class="tag">${icon('clock')}${r.effort}</span>
          <span class="tag">${icon('droplet')}${r.damage}</span>
        </div>
      </div>
    </a>`).join('');
}

function refresh() { renderCatbar(); renderActiveRow(); renderPicker(); renderList(); }

// ---- variant switcher (scaffolding) ----
const keys = Object.keys(VARIANTS);
function setVariant(v) {
  variant = v;
  const url = new URL(location);
  url.searchParams.set('variant', v);
  history.replaceState(null, '', url);
  document.getElementById('vlabel').textContent = `${v} — ${VARIANTS[v]}`;
  openGroup = null;
  renderCatbar(); renderPicker();
}
function cycle(dir) {
  setVariant(keys[(keys.indexOf(variant) + dir + keys.length) % keys.length]);
}
document.getElementById('prev').onclick = (ev) => { ev.stopPropagation(); cycle(-1); };
document.getElementById('next').onclick = (ev) => { ev.stopPropagation(); cycle(1); };
document.addEventListener('keydown', (ev) => {
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
  if (ev.key === 'ArrowLeft') cycle(-1);
  if (ev.key === 'ArrowRight') cycle(1);
});

setVariant(variant);
renderActiveRow();
renderList();
</script>
</body>
</html>
